services:
  postgres:
    image: postgres:16
    container_name: cinema-postgres
    environment:
      POSTGRES_DB: cinema_dev
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - cinema_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/CinemaSystemRandomPlay.Api/Dockerfile
    container_name: cinema-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CinemaDb: Host=postgres;Port=5432;Database=cinema_dev;Username=postgres;Password=postgres
    ports:
      - "8080:8080"

volumes:
  cinema_postgres_data:
