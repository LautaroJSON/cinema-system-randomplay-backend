services:
  postgres:
    image: postgres:16
    container_name: cinema-postgres
    environment:
      POSTGRES_DB: cinema_dev
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - cinema_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: cinema-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: src/CinemaSystemRandomPlay.Api/Dockerfile
    container_name: cinema-api
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Clave de firma SOLO para desarrollo local; en cualquier otro entorno se define por secreto o variable de entorno.
      Invitados__ClaveFirma: clave-de-desarrollo-local-no-usar-en-produccion-0123456789
      ConnectionStrings__CinemaDb: Host=postgres;Port=5432;Database=cinema_dev;Username=postgres;Password=postgres
      # Pagos simulados (sin túnel ni credenciales) y emails atrapados por Mailpit (http://localhost:8025).
      MercadoPago__Modo: Simulado
      Email__Proveedor: Smtp
      Email__Smtp__Host: mailpit
      Email__Smtp__Puerto: "1025"
      Email__Smtp__UsarTls: "false"
    ports:
      - "8080:8080"

volumes:
  cinema_postgres_data:
